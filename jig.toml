require_validation_commands = true
sections = ["Objective", "Acceptance", "Evidence"]
task_document = "TODO.md"
task_heading_level = 3

[change_policy.architecture]
mode = "all"
selectors = []

[change_policy.bugfix]
mode = "all-except"
selectors = ["basename:Cargo.toml", "exact:AGENTS.md", "exact:Cargo.lock", "exact:jig.toml", "exact:rust-toolchain.toml", "prefix:docs/technical/adr/"]

[change_policy.dependency-admission]
mode = "only"
selectors = ["basename:Cargo.toml", "exact:Cargo.lock", "prefix:docs/bibliography/", "prefix:docs/technical/adr/"]

[change_policy.documentation]
mode = "only"
selectors = ["extension:md", "extension:mdc"]

[change_policy.implementation]
mode = "all-except"
selectors = ["basename:Cargo.toml", "exact:AGENTS.md", "exact:Cargo.lock", "exact:jig.toml", "exact:rust-toolchain.toml", "prefix:docs/technical/adr/"]

[change_policy.test]
mode = "only"
selectors = ["directory:tests"]

[header]
adapters = ["c:c:slash-line", "cpp:cpp:slash-line", "cu:cuda:slash-line", "py:python:python", "rs:rust:slash-line", "tex:latex:percent-line"]
confidential = false
copyright = "Copyright (c) 2026 Alberto Villa Osorno."
exempt_paths = ["algorithms/search-pruning-and-state-canonicalization/exact_duplicate.rs", "algorithms/search-pruning-and-state-canonicalization/tests/exact_duplicate.rs", "cli/adapters/doom/windows.c", "linguist/sample.c", "tools/malbolge/main.c"]
extensions = ["c", "cpp", "cu", "py", "rs", "tex"]
max_lines = 96
path_rule = "All paths in this header are repository-root relative."
required_boundary_fields = ["Owns", "Must-Not", "Allows", "Split-When", "Merge-When", "Summary", "Description", "Usage", "Defaults"]
require_module_summary = true

[license]
files = ["LICENSE"]
spdx_expression = "MIT"

[language]
analyzed = ["rust"]
present = ["c", "cpp", "cuda", "latex", "malbolge", "python", "rust"]

[linters.applicability.clang-format]
enabled = false
reason = "Repository-wide execution cannot exclude immutable historical C with the current Jig selector model; authored C is formatted explicitly with pinned LLVM 22.1.8."

[linters.applicability.clang-tidy]
enabled = false
reason = "Repository-wide execution would conflate immutable historical, host/native, and guest C; Malbolge guest compatibility is explicit tools/tidy validation until Jig supports path-scoped native targets."

[linters.override.pyright_ignored_temp]
linter = "pyright"
key = "exclude"
value = ".cache\n.dependencies\n.git\n.temp\n.venv\nnode_modules\ntarget\n**/__pycache__\n**/.temp"
reason = "Gitignored *.temp trees are non-authored scratch; Pyright must not validate concurrent disposable files outside the governed source surface."

[linters.override.pyright_venv]
linter = "pyright"
key = "venv"
value = "3.14.6"
reason = "BasedPyright must resolve the repository-pinned Python environment and its typed pytest dependency instead of the unrelated host interpreter."

[linters.override.pyright_venv_path]
linter = "pyright"
key = "venvPath"
value = ".dependencies/python"
reason = "The repository-pinned virtual environment is rooted below .dependencies/python and is the authoritative Python analysis environment."

[linters.override.ruff_selector_names]
linter = "ruff"
key = "lint.ignore"
value = "missing-trailing-comma\nincorrect-blank-line-before-class\nmulti-line-summary-first-line\nmulti-line-summary-second-line\nsingle-line-implicit-string-concatenation"
reason = "Ruff 0.16 preview rejects deprecated selector codes, and Jig schema 10 requires standalone opening triple quotes for multiline Python module summaries; these reviewed long-name exceptions preserve the intended rules without weakening canonical header validation."

[linters.override.ruff_test_assert_name]
linter = "ruff"
key = "lint.per-file-ignores.\"tests/**/*.py\""
value = "assert"
reason = "Ruff 0.16 preview rejects S101 in selector position; the long rule name `assert` is the exact alias and preserves the reviewed test-only exception."

[linters.applicability.clippy-config]
enabled = true
reason = "clippy.toml governs repository-authored Rust utilities."

[linters.applicability.clippy-lints]
enabled = true
reason = "Workspace Clippy lint levels govern every Rust package."

[linters.applicability.coverage-py]
enabled = false
reason = "Jig first-party coverage will be authoritative."

[linters.applicability.csharp-global]
enabled = false
reason = "The repository contains no C# source."

[linters.applicability.csharp-visualstudio]
enabled = false
reason = "The repository contains no C# source."

[linters.applicability.directory-build]
enabled = true
reason = "MSBuild configuration governs native Windows compiler settings."

[linters.applicability.editorconfig]
enabled = true
reason = "EditorConfig governs repository-authored text surfaces."

[linters.applicability.msvc-cpp]
enabled = true
reason = "MSVC settings govern the admitted native Windows C and C++ surface."

[linters.applicability.pyright]
enabled = true
reason = "Python is an admitted research and orchestration language."

[linters.applicability.pytest]
enabled = true
reason = "pytest governs admitted Python verification work."

[linters.applicability.ruff]
enabled = true
reason = "Ruff governs admitted Python research and orchestration code."

[linters.applicability.rust-toolchain]
enabled = true
reason = "The repository pins Rust for authored utilities and future product code."

[linters.applicability.rustc-lints]
enabled = true
reason = "Workspace rustc lint levels govern every Rust package."

[linters.applicability.rustfmt]
