[pytest]
# Fail closed on configuration drift, unknown markers, warnings, and xfails.
required_plugins = pytest-cov
addopts =
    -ra
    --strict-config
    --strict-markers
    --import-mode=importlib
    --tb=short
    --color=no
    --code-highlight=no
    --cov=.
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=100
cache_dir = .cache/pytest
console_output_style = classic
empty_parameter_set_mark = fail_at_collect
filterwarnings =
    error
norecursedirs =
    .cache
    .dependencies
    .git
    .temp
    .venv
    node_modules
    target
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
xfail_strict = true
