[package]
name = "malbolge-c-frontend-json-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lib]
path = "composition/lib.rs"

[[bin]]
name = "c2malbolge_json"
path = "composition/main.rs"
test = false
bench = false
doc = false

[[test]]
name = "normalized_static_loop_output"
path = "../../../tests/compiler/frontend-json-adapter/normalized_static_loop_output.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
malbolge = { path = "../../.." }

[lints]
workspace = true
