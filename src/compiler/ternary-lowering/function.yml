    kind: application
    language: rust
    responsibility: Compose helper and intrinsic semantics in wrapper order.
  - id: part-0017
    path: application/realize_byte_stream_wrapper.rs
    kind: application
    language: rust
    responsibility: Bind wrapper raw I/O steps to profile machine opcodes.
  - id: part-0018
    path: application/realize_runtime_helper.rs
    kind: application
    language: rust
    responsibility: Expand pure helper semantics into explicit control flow.
  - id: part-0019
    path: application/realize_byte_stream_control_flow.rs
    kind: application
    language: rust
    responsibility: Expand stdio wrapper semantics into explicit control flow.
  - id: part-0020
