    kind: application
    language: rust
    responsibility: Validate and canonically encode pre-layout ternary programs.
  - id: part-0021
    path: port-inbound/frame_helper.rs
    kind: port-inbound
    language: rust
    responsibility: Carry exact call-frame helper identities into lowering.
  - id: part-0022
