    language: rust
    responsibility: Bind frame codec helpers to exact ABI/runtime semantics.
  - id: part-0023
    path: application/realize_frame_helper.rs
    kind: application
    language: rust
    responsibility: Expand frame codec helpers into explicit execution plans.
  - id: part-0024
    path: port-inbound/heap_helper.rs
