[question]
text = """Can guidance trained only on the already characterized three-word \
corpus improve first-hit verifier work on a new four-word holdout relative to \
the best registered non-learned static ordering?"""

[hypothesis]
text = """A pooled initial-decode acceptance-rate model trained only on \
three-word outcomes lowers held-out verifier evaluations to first accepted \
four-word candidate without changing verifier authority."""
material_weakening = """\
Held-out first-hit work is null or worse than the static baseline, leakage is \
detected, or end-to-end learned time including training is dominated by model \
fit and scheduling cost.\
"""

