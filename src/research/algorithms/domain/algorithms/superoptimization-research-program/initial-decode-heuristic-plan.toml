schema_version = 1

[plan]
id = "classic-three-word-initial-halt-heuristic-v1"
record_kind = "plan"
status = "preregistered"
method_class = "optimization"
technique = "initial-decode-halt-proximity-order-v1"
baseline = "deterministic-enumeration-v1"

[profile]
id = "malbolge-1998"
# jig-ignore-next-line: indivisible reviewed identifier
target_profile_fingerprint = "malbolge-profile-v1:sha256:8b8689e5e3daef745d58681efe78106070736abb2ffa0895511fac5150b5b73e"

[question]
text = """Can a verifier-independent initial positional-decode heuristic reduce \
evaluations to the first independently verified three-word halt versus natural \
enumeration on a previously uncharacterized holdout corpus?"""

[hypothesis]
text = """Ranking candidates by the earliest initial source position that \
positionally decodes to halt lowers first-verified evaluation count without \
changing verifier acceptance or quality."""
material_weakening = """\
The heuristic has no verified hit within the shared budget, reaches its first \
verified candidate no earlier than enumeration, or changes any verifier result.\
"""

[challenge]
id = "classic-three-word-verified-block-search-v1"
candidate_count = 830584
candidate_encoding = "lexicographic-three-graphical-bytes-v1"
source_words = 3
objective = "halt-without-prior-input-or-output-within-three-transitions"
quality = "semantic-transitions-to-halt-v1"
verifier = "classic-three-word-no-io-halt-v1"
# jig-ignore-next-line: indivisible reviewed workload identity
workload_sha256 = "03276bbed2b81d90553fa9ddca6046602108f992c48520554651638c626409d4"
status = "registered"
accepted_candidate_count = 86
quality_one_count = 64
quality_two_count = 16
quality_three_count = 6
# jig-ignore-next-line: indivisible reviewed semantic identity
accepted_set_sha256 = "35d107f544fbd71b0008d1414fa4c73677e9d3d15c32e6494a09bd89e2667342"

[comparison]
primary_metric = "first-verified-evaluation"
secondary_metrics = [
  "verified-candidate-count",
  "best-verified-quality",
  "elapsed-nanoseconds",
]
evaluation_budget = 50000
wall_clock_seconds = 60
memory_mib = 512
baseline_order = "deterministic-enumeration-v1"
heuristic_order = "initial-decode-halt-proximity-order-v1"

[heuristic]
feature = "initial-positional-decode-only-v1"
score = "earliest-position-decoding-to-halt-else-three-v1"
score_domain = [0, 1, 2, 3]
tie_break = "ascending-candidate-index"
uses_dynamic_transition = false
uses_verifier_outcome = false
uses_accepted_set = false
uses_training_data = false

[rejection]
conditions = [
  "heuristic first verified evaluation is not lower than enumeration",
  "heuristic has no verified hit when enumeration has one within the budget",
  "verifier acceptance or quality differs for the same candidate",
  "schedule uses dynamic transition or verifier-result information",
  "challenge is characterized before this preregistration commit",
]

[measurement]
id = "initial-decode-heuristic-five-paired-protocol-v1"
repetitions = 5
warmup_iterations = 0
ordering = "fixed-enumeration-then-heuristic"
outlier_policy = "retain-all"
center = "median"
dispersion = "observed-range"
uncertainty = "observed-range"
clock = "time-perf-counter-ns"
timing_scope = "schedule-construction-plus-full-budget-verification"
per_strategy_wall_clock_seconds = 60

[measurement_gate]
challenge_status = "registered"
schedule_status = "registered"
runner_status = "registered"
protocol_status = "registered"
retained_provenance_status = "registered"
results_allowed = true
reason = "source-pinned retained holdout evidence is registered"

[provenance]
# jig-ignore-next-line: canonical path is indivisible
configuration = "src/research/algorithms/domain/algorithms/superoptimization-research-program/initial-decode-heuristic-plan.toml"
implementation = "algorithms/superoptimization-research-program/"
output = "algorithms/superoptimization-research-program/out/"
