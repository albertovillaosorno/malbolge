# Malbolge guest-C compatibility profile.
#
# jig-ignore-next-line: indivisible reviewed identifier
# This file is intentionally NOT named .jig/lang/cpp/.clang-tidy. It must never be inherited
# by arbitrary host/native C in this repository. It is used only when a caller
# jig-ignore-next-line: indivisible reviewed identifier
# explicitly invokes src/automation/repository/composition/scripts/validate/main.py (or tools/tidy directly) for a C
# translation unit that is intended to be lowered to Malbolge.
#
# This is the executable bootstrap envelope built from stock LLVM 22.1.8
# diagnostics. The out-of-tree tools/tidy plugin will add the authoritative
# malbolge-* language, ABI, runtime, determinism, and resource checks that stock
# clang-tidy cannot express.
InheritParentConfig: false

Checks: >
  -*,
  clang-analyzer-core.*,
  bugprone-command-processor,
  bugprone-undefined-memory-manipulation,
  hicpp-no-assembler

# jig-ignore-next-line: indivisible reviewed identifier
WarningsAsErrors: 'clang-analyzer-core.*,bugprone-command-processor,bugprone-undefined-memory-manipulation,hicpp-no-assembler'
HeaderFilterRegex: '.*'
SystemHeaders: false
UseColor: false
FormatStyle: none

# These flags describe the source language accepted by the bootstrap checker;
# they do not define the complete Malbolge ABI or lowerability contract.
ExtraArgs:
  - '-x'
  - 'c'
  - '-std=c23'
  - '-ffreestanding'
  - '-fno-builtin'
  - '-pedantic-errors'
  - '-Werror=implicit-function-declaration'
  - '-Werror=incompatible-pointer-types'
  - '-Werror=int-conversion'
  - '-Werror=return-type'
  - '-Werror=uninitialized'
