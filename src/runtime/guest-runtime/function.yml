schema: jig-function/v3
identity:
  id: guest-runtime
  node: function:guest-runtime
  path: src/runtime/guest-runtime
  role: governed-function
contracts:
  universal: graph-authority/v2
  location: src-function/v1
  domain: domain-runtime/v1
  role: function/v3
classification:
  repository: malbolge
  location: src
  domain: runtime
  lifecycle: implementation
ownership:
  primary: repository:malbolge
  accountable: Alberto Villa Osorno
lifecycle:
  stage: implementation
architecture:
  route: src/<domain>/<function>/<kind>/<part>
  kinds:
    - adapter-inbound
    - adapter-outbound
    - application
    - composition
    - contract
    - domain
    - math
    - port-inbound
    - port-outbound
  boundary:
    owns: one complete governed capability
    must_not: cross undeclared kind or function boundaries
    split_when: another capability needs independent policy
    merge_when: separate ownership has no independent meaning
language_manifest: guest-runtime.jig
parts:
  - id: part-0001
    path: contract/guest-runtime-v1.json
    kind: contract
    responsibility: Define version-one guest-runtime policy and identities.
  - id: part-0002
    path: contract/guest_runtime.h
    kind: contract
    language: c
    responsibility: Define guest heap, frame, startup, and byte semantic APIs.
  - id: part-0003
    path: contract/guest_intrinsics.h
    kind: contract
    language: c
    responsibility: Declare stable byte-I/O symbols for downstream lowering.
  - id: part-0004
    path: domain/byte_stream.c
    kind: domain
    language: c
    responsibility: Map profile I/O words to deterministic C byte semantics.
  - id: part-0005
    path: domain/heap.c
    kind: domain
    language: c
    responsibility: Implement deterministic guest arena allocation semantics.
  - id: part-0006
    path: domain/frame.c
    kind: domain
    language: c
    responsibility: Encode and validate the canonical hidden guest call frame.
  - id: part-0007
    path: domain/startup.c
    kind: domain
    language: c
    responsibility: Bind one guest heap and delegate runtime allocation.
  - id: part-0008
    path: contract/guest_format.h
    kind: contract
    language: c
    responsibility: Define typed locale-free bounded formatting primitives.
  - id: part-0009
    path: domain/format.c
    kind: domain
    language: c
    responsibility: Implement typed integer, string, and character formatting.
  - id: part-0010
    path: contract/guest_format_parse.h
    kind: contract
    language: c
    responsibility: Define stable C23 format-parser token semantics.
  - id: part-0011
    path: domain/format_parse.c
    kind: domain
    language: c
    responsibility: Tokenize C23 printf grammar without consuming varargs.
  - id: part-0012
    path: contract/guest_varargs.h
    kind: contract
    language: c
    responsibility: Define canonical promoted guest variadic cursor semantics.
  - id: part-0013
    path: domain/varargs.c
    kind: domain
    language: c
    responsibility: Decode naturally aligned promoted guest variadic bytes.
  - id: part-0014
    path: contract/guest_format_args.h
    kind: contract
    language: c
    responsibility: Define atomic guest format-argument resolution semantics.
  - id: part-0015
    path: domain/format_args.c
    kind: domain
    language: c
    responsibility: Resolve dynamic fields and promoted arguments atomically.
  - id: part-0016
    path: contract/guest_format_scalar.h
    kind: contract
    language: c
    responsibility: Define resolved scalar printf execution semantics.
  - id: part-0017
    path: domain/format_scalar.c
    kind: domain
    language: c
    responsibility: >-
      Execute promotion-aware integer, character, pointer, and percent output.
  - id: part-0018
    path: contract/guest_format_memory.h
    kind: contract
    language: c
    responsibility: Define bounded guest-object formatting memory semantics.
  - id: part-0019
    path: domain/format_memory.c
    kind: domain
    language: c
    responsibility: >-
      Execute narrow string reads and count stores in guest memory.
  - id: part-0020
    path: contract/guest_format_float.h
    kind: contract
    language: c
    responsibility: Define deterministic binary floating formatting semantics.
  - id: part-0021
    path: domain/format_float.c
    kind: domain
    language: c
    responsibility: >-
      Execute binary64/binary128 hex formatting without host float authority.
  - id: part-0022
    path: contract/guest_decimal_exact.h
    kind: contract
    language: c
    responsibility: Define bounded exact binary64 decimal magnitude semantics.
  - id: part-0023
    path: domain/format_decimal_exact.c
    kind: domain
    language: c
    responsibility: >-
      Convert finite binary64 bits to exact decimal digits without host floats.
projects: []
tests: []
graph:
  node: function:guest-runtime
  labels:
    - hub
    - function
    - repository-governance
  hubs:
    - hub:repository:malbolge
    - hub:location:src
    - hub:domain:runtime
    - hub:role:governed-function
    - hub:lifecycle:implementation
    - hub:function:guest-runtime
provenance:
  authority: .jig/taxonomy.json
  origin: authored
validation:
  mode: active
  language_set: declared-by-language-manifest
  project_coverage: repository-workspace-projection
  part_inventory: observed-files-only
  test_inventory: repository-test-authority
  project_sidecars: repository-owned
  unknown_fields: fatal
