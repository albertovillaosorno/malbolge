schema_version = 1

[study]
id = "rotate-target-broadword-validation-throughput-v1"
experiment_manifest = "benchmarks/accelerator/evidence/2026-07-28-broadword-packed-validation-search-rtx4060/experiment.toml"
kind = "deterministic"
question = "Does exact broadword packed-domain validation lower CUDA prepared median versus scalar packed validation?"
hypothesis = "CUDA prepared median is lower while validator identity, adversarial lane rejection, and every prepared proof pass."
baseline = "benchmarks/accelerator/evidence/2026-07-28-packed-cuda-primitive-search-rtx4060/"
rejection_observation = "CUDA prepared median is not lower, validator identity drifts, an adversarial lane is accepted, or a prepared proof fails."

[workload]
identity = "classic-rotate-target-full-domain-v1"
equivalent = true

[measurement]
warmup_iterations = 1
repetitions = 15
warmup_policy = "one untimed execution of each of the four routes"
ordering = "fixed"
stopping_rule = "exactly fifteen retained samples per route"
outlier_policy = "retain-all"
outlier_rule = "none"

[statistics]
center = "median"
dispersion = "min-max"
uncertainty = "observed-range"

[objectives]
metrics = ["time_ns"]
tradeoff_policy = "exactness, validator identity, and every prepared proof precede CUDA comparison"

[resources]
host = "Microsoft Windows 10.0.26200 x86-64"
accelerator = "NVIDIA GeForce RTX 4060 sm_89"
memory_mib = 8188

[raw]
path = "benchmarks/accelerator/evidence/2026-07-28-broadword-packed-validation-search-rtx4060/raw.csv"
retained = true

[stochastic]
trial_count = 0
failed_trials = 0
seeds = []
