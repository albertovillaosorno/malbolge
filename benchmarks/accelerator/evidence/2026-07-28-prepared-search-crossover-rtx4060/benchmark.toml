schema_version = 1

[study]
id = "rotate-target-preparation-crossover-v1"
experiment_manifest = "benchmarks/accelerator/evidence/2026-07-28-prepared-search-crossover-rtx4060/experiment.toml"
kind = "deterministic"
question = "At what reuse count does exact prepared CUDA become strictly faster than ordinary CUDA, and how does preparation memory scale?"
hypothesis = "Every preregistered scale has a finite strict crossover when reuse median is below ordinary median, with all memory observations retained."
baseline = "same-run ordinary CUDA search at each candidate scale"
rejection_observation = "Any scale lacks a finite crossover, any exact proof drifts, or result/admission identity fails."

[workload]
identity = "classic-rotate-target-preparation-scales-v1"
equivalent = true

[measurement]
warmup_iterations = 1
repetitions = 15
warmup_policy = "one ordinary warmup; one resident build plus one reuse warmup"
ordering = "fixed"
stopping_rule = "exactly fifteen retained timing samples and five retained memory samples per scale"
outlier_policy = "retain-all"
outlier_rule = "none"

[statistics]
center = "median"
dispersion = "min-max"
uncertainty = "observed-range"

[objectives]
metrics = ["time_ns", "memory_bytes", "crossover_runs"]
tradeoff_policy = "exact validator, proposal, admission, state-count, and CUDA session proofs precede timing and memory interpretation"

[resources]
host = "Microsoft Windows 10.0.26200 x86-64"
accelerator = "NVIDIA GeForce RTX 4060 sm_89"
memory_mib = 8188

[raw]
path = "benchmarks/accelerator/evidence/2026-07-28-prepared-search-crossover-rtx4060/raw.csv"
retained = true

[stochastic]
trial_count = 0
failed_trials = 0
seeds = []
