schema_version = 1

[study]
id = "rotate-target-packed-cuda-throughput-v1"
experiment_manifest = "benchmarks/accelerator/evidence/2026-07-28-packed-cuda-primitive-search-rtx4060/experiment.toml"
kind = "deterministic"
question = "Does validated packed CUDA output lower CUDA prepared median versus the CPU-table baseline?"
hypothesis = "CUDA prepared median is lower while immutable-byte, capability, count, domain, table, selector, membership, and resident proofs pass."
baseline = "benchmarks/accelerator/evidence/2026-07-28-cpu-rotate-table-search-rtx4060/"
rejection_observation = "CUDA prepared median is not lower, packed validation fails, a proof counter drifts, or exact proposal admission changes."

[workload]
identity = "classic-rotate-target-full-domain-v1"
equivalent = true

[measurement]
warmup_iterations = 1
repetitions = 15
warmup_policy = "one untimed execution of each of the four routes"
ordering = "fixed"
stopping_rule = "exactly fifteen retained samples per route"
outlier_policy = "retain-all"
outlier_rule = "none"

[statistics]
center = "median"
dispersion = "min-max"
uncertainty = "observed-range"

[objectives]
metrics = ["time_ns"]
tradeoff_policy = "exactness and every prepared proof identity precede CUDA time comparison"

[resources]
host = "Microsoft Windows 10.0.26200 x86-64"
accelerator = "NVIDIA GeForce RTX 4060 sm_89"
memory_mib = 8188

[raw]
path = "benchmarks/accelerator/evidence/2026-07-28-packed-cuda-primitive-search-rtx4060/raw.csv"
retained = true

[stochastic]
trial_count = 0
failed_trials = 0
seeds = []
