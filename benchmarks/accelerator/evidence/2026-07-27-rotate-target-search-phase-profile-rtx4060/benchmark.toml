schema_version = 1

[study]
id = "rotate-target-search-phase-profile-v1"
experiment_manifest = "benchmarks/accelerator/evidence/2026-07-27-rotate-target-search-phase-profile-rtx4060/experiment.toml"
kind = "deterministic"
question = "Do named phases explain at least 80 percent of inclusive search wall time on both backends?"
hypothesis = "The median named-phase sum is at least 80 percent of median total wall time for CPU and CUDA."
baseline = "inclusive profile_search total wall time"
rejection_observation = "Either backend has below 80 percent phase coverage, proposal drift, or failed CPU admission."

[workload]
identity = "classic-rotate-target-full-domain-v1"
equivalent = true

[measurement]
warmup_iterations = 1
repetitions = 15
warmup_policy = "one untimed identical profiled search per backend"
ordering = "fixed"
stopping_rule = "exactly fifteen retained profiles per backend"
outlier_policy = "retain-all"
outlier_rule = "none"

[statistics]
center = "median"
dispersion = "min-max"
uncertainty = "observed-range"

[objectives]
metrics = ["time_ns", "phase_coverage_percent"]
tradeoff_policy = "proposal equality and independent CPU admission precede phase attribution"

[resources]
host = "Microsoft Windows 10.0.26200 x86-64"
accelerator = "NVIDIA GeForce RTX 4060 sm_89"
memory_mib = 8188

[raw]
path = "benchmarks/accelerator/evidence/2026-07-27-rotate-target-search-phase-profile-rtx4060/raw.csv"
retained = true

[stochastic]
trial_count = 0
failed_trials = 0
seeds = []
