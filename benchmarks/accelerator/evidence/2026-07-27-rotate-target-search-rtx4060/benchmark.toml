schema_version = 1

[study]
id = "rotate-target-search-cpu-vs-cuda-v1"
experiment_manifest = "benchmarks/accelerator/evidence/2026-07-27-rotate-target-search-rtx4060/experiment.toml"
kind = "deterministic"
question = "Does CUDA reduce full-domain rotate-target search wall time versus the exact CPU reference?"
hypothesis = "CUDA median wall time is lower than CPU median wall time on the identical workload."
baseline = "cpu-reference"
rejection_observation = "CUDA median is not lower, proposals differ, or independent CPU admission fails."

[workload]
identity = "classic-rotate-target-full-domain-v1"
equivalent = true

[measurement]
warmup_iterations = 1
repetitions = 15
warmup_policy = "one untimed identical full-domain search per backend"
ordering = "fixed"
stopping_rule = "exactly fifteen retained samples per backend"
outlier_policy = "retain-all"
outlier_rule = "none"

[statistics]
center = "median"
dispersion = "min-max"
uncertainty = "observed-range"

[objectives]
metrics = ["time_ns"]
tradeoff_policy = "proposal equality and independent CPU admission precede time comparison"

[resources]
host = "Microsoft Windows 10.0.26200 x86-64"
accelerator = "NVIDIA GeForce RTX 4060 sm_89"
memory_mib = 8188

[raw]
path = "benchmarks/accelerator/evidence/2026-07-27-rotate-target-search-rtx4060/raw.csv"
retained = true

[stochastic]
trial_count = 0
failed_trials = 0
seeds = []
