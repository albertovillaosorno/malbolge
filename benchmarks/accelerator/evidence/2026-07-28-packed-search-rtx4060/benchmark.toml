schema_version = 1

[study]
id = "rotate-target-packed-search-throughput-v1"
experiment_manifest = "benchmarks/accelerator/evidence/2026-07-28-packed-search-rtx4060/experiment.toml"
kind = "deterministic"
question = "Does fixed-width packed evidence reduce ordinary and prepared full-domain search medians versus the retained item-materializing baseline?"
hypothesis = "Every route median is lower than its equivalent retained pre-packed median while proposals and CPU admission remain exact."
baseline = "benchmarks/accelerator/evidence/2026-07-28-prepared-search-rtx4060/"
rejection_observation = "Any route median is not lower, proposals differ, or independent CPU admission fails."

[workload]
identity = "classic-rotate-target-full-domain-v1"
equivalent = true

[measurement]
warmup_iterations = 1
repetitions = 15
warmup_policy = "one untimed execution of each of the four routes"
ordering = "fixed"
stopping_rule = "exactly fifteen retained samples per route"
outlier_policy = "retain-all"
outlier_rule = "none"

[statistics]
center = "median"
dispersion = "min-max"
uncertainty = "observed-range"

[objectives]
metrics = ["time_ns"]
tradeoff_policy = "exact proposal identity and independent CPU admission precede time comparison"

[resources]
host = "Microsoft Windows 10.0.26200 x86-64"
accelerator = "NVIDIA GeForce RTX 4060 sm_89"
memory_mib = 8188

[raw]
path = "benchmarks/accelerator/evidence/2026-07-28-packed-search-rtx4060/raw.csv"
retained = true

[stochastic]
trial_count = 0
failed_trials = 0
seeds = []
