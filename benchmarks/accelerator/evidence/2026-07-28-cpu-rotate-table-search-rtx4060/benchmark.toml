schema_version = 1

[study]
id = "rotate-target-cpu-table-throughput-v1"
experiment_manifest = "benchmarks/accelerator/evidence/2026-07-28-cpu-rotate-table-search-rtx4060/experiment.toml"
kind = "deterministic"
question = "Does an exact scalar-derived rotate table lower CPU prepared median versus extrema validation?"
hypothesis = "CPU prepared median is lower while exhaustive equality, table/evaluation counters, and all existing prepared proof identities pass."
baseline = "benchmarks/accelerator/evidence/2026-07-28-extrema-validation-search-rtx4060/"
rejection_observation = "CPU prepared median is not lower, exhaustive equality fails, table/evaluation counters drift, or another prepared proof fails."

[workload]
identity = "classic-rotate-target-full-domain-v1"
equivalent = true

[measurement]
warmup_iterations = 1
repetitions = 15
warmup_policy = "one untimed execution of each of the four routes"
ordering = "fixed"
stopping_rule = "exactly fifteen retained samples per route"
outlier_policy = "retain-all"
outlier_rule = "none"

[statistics]
center = "median"
dispersion = "min-max"
uncertainty = "observed-range"

[objectives]
metrics = ["time_ns"]
tradeoff_policy = "exactness and every prepared proof identity precede CPU time comparison"

[resources]
host = "Microsoft Windows 10.0.26200 x86-64"
accelerator = "NVIDIA GeForce RTX 4060 sm_89"
memory_mib = 8188

[raw]
path = "benchmarks/accelerator/evidence/2026-07-28-cpu-rotate-table-search-rtx4060/raw.csv"
retained = true

[stochastic]
trial_count = 0
failed_trials = 0
seeds = []
