schema_version = 1

[study]
id = "rotate-target-prepared-search-phase-profile-v1"
experiment_manifest = "benchmarks/accelerator/evidence/2026-07-28-prepared-search-phase-profile-rtx4060/experiment.toml"
kind = "deterministic"
question = "Do named post-preparation phases explain at least 95 percent of prepared search wall time on CPU and CUDA?"
hypothesis = "Named phases cover at least 95 percent of median total time and backend evaluation is the largest phase on both backends."
baseline = "inclusive profile_prepared_search total wall time"
rejection_observation = "Either backend has below 95 percent phase coverage, backend evaluation is not largest, proposals differ, or CPU admission fails."

[workload]
identity = "classic-rotate-target-full-domain-v1"
equivalent = true

[measurement]
warmup_iterations = 1
repetitions = 15
warmup_policy = "one untimed prepared profile per backend"
ordering = "fixed"
stopping_rule = "exactly fifteen retained profiles per backend"
outlier_policy = "retain-all"
outlier_rule = "none"

[statistics]
center = "median"
dispersion = "min-max"
uncertainty = "observed-range"

[objectives]
metrics = ["time_ns", "phase_coverage_percent"]
tradeoff_policy = "exact proposal identity and independent CPU admission precede phase attribution"

[resources]
host = "Microsoft Windows 10.0.26200 x86-64"
accelerator = "NVIDIA GeForce RTX 4060 sm_89"
memory_mib = 8188

[raw]
path = "benchmarks/accelerator/evidence/2026-07-28-prepared-search-phase-profile-rtx4060/raw.csv"
retained = true

[stochastic]
trial_count = 0
failed_trials = 0
seeds = []
