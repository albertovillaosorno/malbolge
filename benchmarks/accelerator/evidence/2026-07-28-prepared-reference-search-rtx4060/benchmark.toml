schema_version = 1

[study]
id = "rotate-target-prepared-reference-throughput-v1"
experiment_manifest = "benchmarks/accelerator/evidence/2026-07-28-prepared-reference-search-rtx4060/experiment.toml"
kind = "deterministic"
question = "Does exact prepared CPU-reference equality reduce CUDA prepared search median versus broadword validation?"
hypothesis = "CUDA prepared median is lower while both validator IDs, 59,049 reference words, and every prior proof pass."
baseline = "benchmarks/accelerator/evidence/2026-07-28-broadword-packed-validation-search-rtx4060/"
rejection_observation = "CUDA prepared median is not lower, an identity/count/proof drifts, or exact result/admission fails."

[workload]
identity = "classic-rotate-target-full-domain-v1"
equivalent = true

[measurement]
warmup_iterations = 1
repetitions = 15
warmup_policy = "one untimed execution using the exact prepared state"
ordering = "fixed"
stopping_rule = "exactly fifteen retained samples per measured route"
outlier_policy = "retain-all"
outlier_rule = "none"

[statistics]
center = "median"
dispersion = "min-max"
uncertainty = "observed-range"

[objectives]
metrics = ["time_ns"]
tradeoff_policy = "exact CPU truth, immutable bytes, and every execution/admission proof precede timing"

[resources]
host = "Microsoft Windows 10.0.26200 x86-64"
