schema_version = 1

[study]
id = "rotate-target-direct-selection-throughput-v1"
experiment_manifest = "benchmarks/accelerator/evidence/2026-07-28-direct-rotate-selection-rtx4060/experiment.toml"
kind = "deterministic"
question = "Does exact prepared rotate-position selection lower CPU and CUDA prepared medians versus indexed membership?"
hypothesis = "Both prepared medians are lower while exact proposals, CPU admission, one selector position, full membership, and resident identity pass."
baseline = "benchmarks/accelerator/evidence/2026-07-28-indexed-membership-search-rtx4060/"
rejection_observation = "Either prepared median is not lower, exactness fails, selector count differs from one, membership differs, or resident counters drift."

[workload]
identity = "classic-rotate-target-full-domain-v1"
equivalent = true

[measurement]
warmup_iterations = 1
repetitions = 15
warmup_policy = "one untimed execution of each of the four routes"
ordering = "fixed"
stopping_rule = "exactly fifteen retained samples per route"
outlier_policy = "retain-all"
outlier_rule = "none"

[statistics]
center = "median"
dispersion = "min-max"
uncertainty = "observed-range"

[objectives]
metrics = ["time_ns"]
tradeoff_policy = "exactness and all prepared-proof identities precede time comparison"

[resources]
host = "Microsoft Windows 10.0.26200 x86-64"
accelerator = "NVIDIA GeForce RTX 4060 sm_89"
memory_mib = 8188

[raw]
path = "benchmarks/accelerator/evidence/2026-07-28-direct-rotate-selection-rtx4060/raw.csv"
retained = true

[stochastic]
trial_count = 0
failed_trials = 0
seeds = []
