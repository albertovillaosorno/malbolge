schema_version = 1

[study]
id = "rotate-target-selection-preparer-crossover-v7"
experiment_manifest = "benchmarks/accelerator/evidence/2026-07-28-native-view-selector-crossover-rtx4060/experiment.toml"
kind = "deterministic"
question = "Does scanning proof-bound rotate payloads through a native u32 view remove selector-copy peak without changing exact positions or preparation crossover?"
hypothesis = "At full domain, the native-view selector lowers component and total peak allocation, preserves exact positions and one-run crossover, and does not materially regress complete preparation."
baseline = "retained version-6 in-place packed batch-builder evidence from source commit 4cb61a7b9e58fb147e3b1646df9f001069b3cb06 plus same-run historical array-copy selector modeling"
rejection_observation = "Selector identity or exact positions drift, full-domain total peak does not improve, preparation crossover changes, or complete preparation regresses materially. Small-scale and selector-local timing regressions remain explicit tradeoffs."

[workload]
identity = "classic-rotate-target-preparation-scales-v1"
equivalent = true

[measurement]
warmup_iterations = 1
repetitions = 15
warmup_policy = "one selector warmup per model; one ordinary warmup; one resident build plus one reuse warmup"
ordering = "fixed"
stopping_rule = "fifteen retained timing samples and five retained memory samples per selector and crossover scale"
outlier_policy = "retain-all"
outlier_rule = "none"

[statistics]
center = "median"
dispersion = "min-max"
uncertainty = "observed-range"

[objectives]
metrics = ["time_ns", "memory_bytes", "crossover_runs", "exact_position_count"]
tradeoff_policy = "selector, builder, storage, membership, validators, proposal, admission, cardinality, and CUDA session proofs precede memory and crossover interpretation"

[resources]
host = "Microsoft Windows 10.0.26200 x86-64"
accelerator = "NVIDIA GeForce RTX 4060 sm_89"
memory_mib = 8188

[raw]
path = "benchmarks/accelerator/evidence/2026-07-28-native-view-selector-crossover-rtx4060/raw.csv"
retained = true

