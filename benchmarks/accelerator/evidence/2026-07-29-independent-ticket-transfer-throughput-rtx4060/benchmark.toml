schema_version = 1

[study]
id = "cuda-independent-ticket-transfer-throughput-v1"
experiment_manifest = "benchmarks/accelerator/evidence/2026-07-29-independent-ticket-transfer-throughput-rtx4060/experiment.toml"
kind = "deterministic"
question = "Does registered same-stream transfer submission reduce exact group-eight CUDA ticket time versus the synchronous grouped default?"
hypothesis = "Streamed group-eight grouped median is lower than synchronous grouped and streamed sequential controls with more than seven paired wins against each."
baseline = "same-run synchronous sequential/grouped and streamed sequential routes over groups 1, 2, 4, and 8"
rejection_observation = "Streamed group-eight grouped median is not lower than both controls, either paired-win count does not exceed seven, or any workload, output, launch, transfer, storage, or backend identity check fails."

[workload]
identity = "classic-crazy-full-domain-ticket-transfer-v1"
equivalent = true

[measurement]
warmup_iterations = 1
repetitions = 15
warmup_policy = "one untimed execution per retained route"
ordering = "fixed"
stopping_rule = "exactly fifteen retained samples per route with cyclic first-route rotation"
outlier_policy = "retain-all"
outlier_rule = "none"

[statistics]
center = "median"
dispersion = "standard-deviation"
uncertainty = "observed-range"

[objectives]
metrics = ["time_ns"]
tradeoff_policy = "identical ticket counts, exact CPU-reference bytes, launch/transfer/storage identities, and CUDA backend identity must pass; wall time alone cannot establish physical transfer/kernel overlap"

[resources]
host = "Microsoft Windows 11 Pro 10.0.26200 x86-64"
accelerator = "NVIDIA GeForce RTX 4060 sm_89"
memory_mib = 8188

[raw]
path = "benchmarks/accelerator/evidence/2026-07-29-independent-ticket-transfer-throughput-rtx4060/raw.csv"
retained = true

[stochastic]
trial_count = 0
failed_trials = 0
seeds = []
