schema_version = 1

[study]
id = "rotate-target-resident-primitive-throughput-v1"
experiment_manifest = "benchmarks/accelerator/evidence/2026-07-28-resident-primitive-search-rtx4060/experiment.toml"
kind = "deterministic"
question = "Does one proof-bound resident CUDA primitive session lower the CUDA prepared median and beat same-run CPU prepared search?"
hypothesis = "CUDA prepared is lower than the prepared-input baseline and same-run CPU prepared while exact proposals, CPU admission, and session counters pass."
baseline = "benchmarks/accelerator/evidence/2026-07-28-prepared-primitive-search-rtx4060/"
rejection_observation = "CUDA prepared is not lower, does not beat same-run CPU, exactness fails, or resident counters differ from one build and fifteen reuses."

[workload]
identity = "classic-rotate-target-full-domain-v1"
equivalent = true

[measurement]
warmup_iterations = 1
repetitions = 15
warmup_policy = "one untimed execution of each of the four routes"
ordering = "fixed"
stopping_rule = "exactly fifteen retained samples per route"
outlier_policy = "retain-all"
outlier_rule = "none"

[statistics]
center = "median"
dispersion = "min-max"
uncertainty = "observed-range"

[objectives]
metrics = ["time_ns"]
tradeoff_policy = "exactness and explicit resident-session identity precede time comparison"

[resources]
host = "Microsoft Windows 10.0.26200 x86-64"
accelerator = "NVIDIA GeForce RTX 4060 sm_89"
memory_mib = 8188

[raw]
path = "benchmarks/accelerator/evidence/2026-07-28-resident-primitive-search-rtx4060/raw.csv"
retained = true

[stochastic]
trial_count = 0
failed_trials = 0
seeds = []
