schema_version = 1

[study]
id = "history-residue-canonicalization-windows-2026-08-12"
# jig-ignore-next-line: canonical evidence path is indivisible
experiment_manifest = "benchmarks/research/evidence/2026-08-12-history-residue-canonicalization-windows/experiment.toml"
kind = "deterministic"
question = """\
Does exact history-residue canonicalization reduce unique search states and \
verifier calls without changing exact semantics, and what host timing does the \
implementation exhibit?\
"""
hypothesis = """\
Exact residue state reduces unique search states and independent verifier calls \
on the frozen corpus without changing per-observation semantics.\
"""
baseline = "raw-visit-count-state-v1"
rejection_observation = """\
Exact semantic output differs, unique search states do not decrease, or the \
source-pinned retained run cannot be replayed.\
"""

[workload]
identity = "classic-history-residue-search-v1"
equivalent = true

[measurement]
warmup_iterations = 0
repetitions = 5
warmup_policy = "no warmup; all five fixed-order pairs are retained"
ordering = "fixed"
stopping_rule = "raw then canonicalized; each arm runs the 10,000-item corpus with a 60-second bound"
outlier_policy = "retain-all"
outlier_rule = "none"

[statistics]
center = "median"
dispersion = "min-max"
uncertainty = "observed-range"

[objectives]
metrics = [
  "unique_search_states",
  "independent_verifier_calls",
  "peak_frontier_states",
  "elapsed_nanoseconds",
]
tradeoff_policy = """\
Treat structural work reduction and host timing as separate objectives; semantic \
equality is mandatory and timing cannot override semantic rejection.\
"""

[resources]
host = "Microsoft Windows 11 Pro 10.0.26200 x64-based PC"
accelerator = "none"
memory_mib = 512

[raw]
# jig-ignore-next-line: canonical evidence path is indivisible
path = "benchmarks/research/evidence/2026-08-12-history-residue-canonicalization-windows/raw.csv"
retained = true

[stochastic]
trial_count = 0
failed_trials = 0
seeds = []
