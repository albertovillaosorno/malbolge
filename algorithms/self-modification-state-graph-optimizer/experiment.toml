[experiment]
id = "self-modification-state-graph-optimizer"
seed = 0
method_class = "optimization"

[challenge]
family = "classic-exact-state-baseline"
difficulty = 59049

[budget]
step_budget = 8
profile = "malbolge-1998"

[verification]
required = true
correspondence = "math/specification/correspondence.toml"
rejection_condition = "any exact-state hash collision that merges unequal snapshots, or any reduced-key merge with divergent future observations"

[reduction.consumed_input_prefix]
baseline = "exact-state"
candidate = "drop-consumed-input-prefix-content"
domain = "same cursor, same remaining input suffix, otherwise exact-equal state"
first_byte_domain = 256

[reduction.terminal_state]
baseline = "exact-state"
candidate = "drop-dead-state-after-termination"
domain = "terminated state with exact profile, output prefix, and termination reason"

[profile_baseline]
profile = "malbolge-2026.2"
memory_words = 4782969
identity = "validated-complete-checkpoint"
performance_claim = false

[profile_baseline.benchmark]
command = ".dependencies/jig/source/.dependencies/rust/stable-1.97.1-x86_64-pc-windows-gnu/bin/cargo.exe run --release --bin state_graph_benchmark --quiet"
evidence = "benchmarks/research/state-graph/evidence/2026-07-27-windows-x86_64"
samples_per_operation = 15

[reduction.memory_delta_bound]
baseline = "complete-before-after-memory"
candidate = "at-most-two-changed-cells-per-step"
domain = "all instruction families in classic and current profiles"
maximum_changed_cells = 2
