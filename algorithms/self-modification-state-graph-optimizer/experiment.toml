[experiment]
id = "self-modification-state-graph-optimizer"
seed = 0
method_class = "optimization"

[challenge]
family = "classic-exact-state-baseline"
difficulty = 59049

[budget]
step_budget = 8
profile = "malbolge-1998"

[verification]
required = true
correspondence = "math/specification/correspondence.toml"
rejection_condition = "any exact-state hash collision that merges unequal snapshots, or any reduced-key merge with divergent future observations"

[reduction.consumed_input_prefix]
baseline = "exact-state"
candidate = "drop-consumed-input-prefix-content"
domain = "same cursor, same remaining input suffix, otherwise exact-equal state"
first_byte_domain = 256

[reduction.terminal_state]
baseline = "exact-state"
candidate = "drop-dead-state-after-termination"
domain = "terminated state with exact profile, output prefix, and termination reason"

[profile_baseline]
profile = "malbolge-2026.2"
memory_words = 4782969
identity = "validated-complete-checkpoint"
performance_claim = false

[profile_baseline.benchmark]
command = ".dependencies/jig/source/.dependencies/rust/stable-1.97.1-x86_64-pc-windows-gnu/bin/cargo.exe run --release --bin state_graph_benchmark --quiet"
evidence = "benchmarks/research/state-graph/evidence/2026-07-27-windows-x86_64"
samples_per_operation = 15

[reduction.memory_delta_bound]
baseline = "complete-before-after-memory"
candidate = "at-most-two-changed-cells-per-step"
domain = "all instruction families in classic and current profiles"
maximum_changed_cells = 2

[reduction.persistent_memory]
baseline = "full-current-checkpoint-per-state"
candidate = "shared-root-plus-exact-trace-patches"
maximum_patch_cells = 2
materialization_role = "oracle-only"
before_value_validation = true

[persistent_depth.benchmark]
commit = "51fb0b6"
evidence = "benchmarks/research/state-graph/evidence/2026-07-27-depth-windows-x86_64"
depths = [1, 8, 64, 512, 4096]
samples_per_case = 15
latest_hit_expectation = "depth-independent"
root_miss_hypothesis = "linear-in-patch-depth"

[reduction.indexed_memory]
baseline = "shared-root-linked-patch-chain"
candidate = "shared-root-four-level-64-way-radix-overlay"
address_bits = 24
radix_bits_per_level = 6
radix_levels = 4
current_profile_supported = true
full_materialization_role = "oracle-only"

[indexed_memory.benchmark]
commit = "ec459d0"
evidence = "benchmarks/research/state-graph/evidence/2026-07-27-indexed-windows-x86_64"
depths = [1, 8, 64, 512, 4096]
samples_per_case = 15
verdict = "promote-current-profile-memory-candidate"
next_risk = "exact-state-identity-without-full-materialization"

[reduction.incremental_state_identity]
baseline = "complete-checkpoint-hash-and-equality-per-observation"
candidate = "lineage-bound-incremental-digest-plus-exact-canonical-state"
foreign_lineage = "fail-closed"
digest_role = "bucket-only"
collision_confirmation = "exact-state-equality"
materialization_role = "oracle-only"

[incremental_state_identity.benchmark]
commit = "f317f3e"
evidence = "benchmarks/research/state-graph/evidence/2026-07-27-state-identity-windows-x86_64"
samples_per_case = 15
operations_per_incremental_sample = 4096
verdict = "promote-lineage-bound-incremental-identity"
next_risk = "append-only-output-storage"

[reduction.persistent_output]
baseline = "clone-complete-output-vector-on-state-update"
candidate = "shared-prefix-plus-immutable-byte-tail"
digest_role = "filter-only"
exact_equality = "shared-tail-or-bytewise"
long_history_fixture_bytes = 65536

[persistent_output.benchmark]
commit = "1d229d0"
evidence = "benchmarks/research/state-graph/evidence/2026-07-27-output-windows-x86_64"
lengths = [0, 1024, 65536, 262144]
samples_per_case = 15
verdict = "promote-persistent-output-storage"
next_risk = "native-region-safety-and-guards"

[reduction.exact_region_certificate]
baseline = "normative-profile-vm-bounded-replay"
candidate = "verifier-produced-exact-state-region-shortcut"
certificate_trust = "untrusted-until-normative-reexecution"
entry_guard = "exact-incremental-state-equality"
digest_guard_allowed = false
rejected_transition = "never-promote"
next_risk = "dependency-read-set-guard-reduction"
