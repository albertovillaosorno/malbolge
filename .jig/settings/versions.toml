domain = "versions"
schema_version = 1

[authority.basedpyright]
current = "1.39.9"
stable = "1.39.9"

[authority.basedpyright.projection.tool]
kind = "tool"
target = "basedpyright"
template = "{version}"

[authority.chktex]
current = "1.7.9"
stable = "1.7.9"

[authority.chktex.projection.tool]
kind = "tool"
target = "chktex"
template = "{version}"

[authority.clippy-nightly]
current = "0.1.99"
stable = "0.1.99"

[authority.clippy-nightly.projection.cargo_clippy]
kind = "tool"
target = "rust_nightly_cargo_clippy"
template = "{version}"

[authority.git]
current = "2.55.0"
stable = "2.55.0"

[authority.git.projection.tool]
kind = "tool"
target = "git"
template = "{version}"

[authority.latexmk]
current = "4.88"
stable = "4.88"

[authority.latexmk.projection.tool]
kind = "tool"
target = "latexmk"
template = "{version}"

[authority.pytest]
current = "9.1.1"
stable = "9.1.1"

[authority.pytest.projection.tool]
kind = "tool"
target = "pytest"
template = "{version}"

[authority.ruff]
current = "0.16.0"
stable = "0.16.0"

[authority.ruff.projection.tool]
kind = "tool"
target = "ruff"
template = "{version}"

[authority.rust-stable]
current = "1.97.1"
stable = "1.97.1"

[authority.rust-stable.projection.cargo_rust_version]
kind = "toml"
path = "Cargo.toml"
selector = "package.rust-version"
template = "{version}"

[authority.rust-stable.projection.cargo_tool]
kind = "tool"
target = "rust_stable_cargo"
template = "{version}"

[authority.rust-stable.projection.rust_toolchain]
kind = "toml"
path = ".jig/version/rust-toolchain.toml"
selector = "toolchain.channel"
template = "{version}"

[authority.rustfmt-nightly]
current = "1.9.0-nightly"
stable = "1.9.0-nightly"

[authority.rustfmt-nightly.projection.cargo_fmt]
kind = "tool"
target = "rust_nightly_cargo_fmt"
template = "{version}"
