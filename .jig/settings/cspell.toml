domain = "cspell"
schema_version = 1
config_path = ".jig/cspell/cspell.json"
dictionary_root = ".jig/cspell"
files = ["**/*.{md,mdc,rs,toml,json,jsonc,yml,yaml}", ".editorconfig", ".editorignore", ".gitattributes", ".gitignore"]
ignore_paths = [".cache/**", ".dependencies/**", ".git/**", ".logs/**", ".temp/**", "Cargo.lock", "engine/src/adapters/rust/generated/**", "pnpm-lock.yaml", "scraping/contracts/rust/generated/**", "target/**"]
language = "en-US"
min_word_length = 3
schema = "https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json"
version = "0.2"

[dictionary.english]
name = "jig-english"
path = ".jig/cspell/english.txt"

[dictionary.named-entities]
name = "jig-named-entities"
path = ".jig/cspell/named-entities.txt"

[dictionary.technical]
name = "jig-technical"
path = ".jig/cspell/technical.txt"
